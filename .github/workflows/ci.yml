name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: virgool
      # Dummy values only — the test suites replace OTP delivery with a stub
      # and sign their own tokens. No real secrets are required in CI.
      COOKIE_SECRET: ci-cookie-secret
      OTP_TOKEN_SECRET: ci-otp-token-secret
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      EMAIL_TOKEN_SECRET: ci-email-token-secret
      PHONE_TOKEN_SECRET: ci-phone-token-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_SECRET_ID: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/redirect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nest build
      # No --fix here: the repository lint script auto-fixes, which would
      # mask violations in CI. This is the same check Phase 1 requires
      # to exit with status 0.
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npx jest --runInBand

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
